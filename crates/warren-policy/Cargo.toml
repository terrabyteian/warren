[package]
name = "warren-policy"
description = "Policy schema and its compilation to Cedar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Parsing the YAML policy surface and compiling it to Cedar. The control plane
# enables this; data-path builds do not, so neither the YAML parser nor the
# compiler reaches the relay or connector through this crate.
[features]
compiler = ["dep:cedar-policy", "dep:saphyr-parser", "dep:serde_json"]

[dependencies]
cedar-policy = { workspace = true, optional = true }
saphyr-parser = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
warren-core.workspace = true

[lints]
workspace = true
