[package]
name = "warren"
description = "One binary for warren's control plane, relay and connector roles, and the command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Each role is a feature. A data-path build is
# `--no-default-features --features relay,connector`, and the macOS client
# release is `--no-default-features --features client`; neither may link
# control-plane, console or Kubernetes crates (scripts/check-closure.sh).
[features]
default = ["control-plane", "relay", "connector", "client"]
control-plane = ["dep:warren-control"]
relay = ["dep:warren-relay", "dep:warren-core", "dep:warren-masque", "dep:rustls"]
connector = ["dep:warren-connector", "dep:warren-core", "dep:warren-masque", "dep:rustls"]
client = ["dep:warren-client", "dep:warren-core", "dep:warren-masque", "dep:serde_json", "dep:libc"]

[dependencies]
clap.workspace = true
rustls = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
warren-client = { workspace = true, optional = true }
warren-core = { workspace = true, optional = true }
warren-masque = { workspace = true, optional = true }
warren-connector = { workspace = true, optional = true }
warren-control = { workspace = true, optional = true }
warren-relay = { workspace = true, optional = true }

# Privilege separation and the utun device for `warren up` on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true, optional = true }

[lints]
workspace = true
