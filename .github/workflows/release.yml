name: Release

# On a version tag, builds the macOS command-line client as one universal
# binary (arm64 and x86_64), signed ad hoc and not notarized (the project
# has no Apple Developer membership yet), and attaches it to the tag's
# GitHub release with its SHA-256. Run by hand, it builds without
# publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  macos-client:
    name: macOS command-line client (universal, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: test the client
        run: cargo test -p warren --no-default-features --features client --locked --offline
      - name: build the client for both architectures
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p warren --no-default-features --features client --target "$target" --locked --offline
          done
      - name: universal binary and tarball
        run: scripts/package-macos.sh "$GITHUB_REF_NAME" dist
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="The macOS command-line client is unsigned and not notarized: after downloading, check its SHA-256, then run \`xattr -d com.apple.quarantine warren\` before installing it. See docs/macos.md."
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes"
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "dist/warren-$GITHUB_REF_NAME-macos-universal.tar.gz" \
            "dist/warren-$GITHUB_REF_NAME-macos-universal.tar.gz.sha256"
