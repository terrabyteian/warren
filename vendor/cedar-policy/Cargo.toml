[package]
edition = "2021"
rust-version = "1.89"
name = "cedar-policy"
version = "4.13.0"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cedar is a language for defining permissions as policies, which describe who should have access to what."
homepage = "https://cedarpolicy.com"
readme = "README.md"
keywords = [
    "cedar",
    "authorization",
    "policy",
    "security",
]
categories = [
    "compilers",
    "config",
]
license = "Apache-2.0"
repository = "https://github.com/cedar-policy/cedar"

[package.metadata.docs.rs]
features = ["experimental"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = '''
## \[Unreleased\]

Cedar Language Version: TBD'''
replace = """
## [Unreleased]

Cedar Language Version: TBD

## [{{version}}] - Coming soon

Cedar Language Version: $$CEDAR_LANGUAGE_VERSION$$"""
exactly = 1

[features]
corpus-timing = []
datetime = ["cedar-policy-core/datetime"]
decimal = ["cedar-policy-core/decimal"]
default = [
    "ipaddr",
    "decimal",
    "datetime",
]
deprecated-schema-compat = []
entity-manifest = ["cedar-policy-core/entity-manifest"]
experimental = [
    "partial-eval",
    "permissive-validate",
    "partial-validate",
    "entity-manifest",
    "protobufs",
    "tolerant-ast",
    "extended-schema",
    "deprecated-schema-compat",
    "tpe",
    "variadic-is-in-range",
]
extended-schema = ["cedar-policy-core/extended-schema"]
heap-profiling = ["dep:dhat"]
ipaddr = ["cedar-policy-core/ipaddr"]
partial-eval = ["cedar-policy-core/partial-eval"]
partial-validate = ["cedar-policy-core/partial-validate"]
permissive-validate = []
protobufs = [
    "dep:nonempty",
    "dep:prost",
    "dep:prost-build",
]
tolerant-ast = [
    "cedar-policy-core/tolerant-ast",
    "cedar-policy-formatter/tolerant-ast",
]
tpe = ["cedar-policy-core/tpe"]
variadic-is-in-range = ["cedar-policy-core/variadic-is-in-range"]
wasm = [
    "tsify",
    "wasm-bindgen",
]

[lib]
name = "cedar_policy"
path = "src/lib.rs"

[[test]]
name = "proto_decode_regression"
path = "tests/proto_decode_regression.rs"

[[test]]
name = "proto_generate_test_files"
path = "tests/proto_generate_test_files.rs"

[[test]]
