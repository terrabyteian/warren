# The warren control-plane API, versioned under /v1.
#
# Three audiences share one specification: clients (link D in
# docs/protocol.md), relays and connectors (link E), and admins (the admin
# API, which in M1 listens only on the control plane's local Unix socket).
# This file is the start of the stable admin API the design promises; it is
# checked against the routes the control plane serves by
# crates/warren-control/tests/openapi.rs.
openapi: 3.1.0
info:
  title: warren control plane
  version: v1
  description: >-
    Sign-in, device enrollment, certificates and entitlements for clients;
    joining, policy bundles, the revocation push channel and decision-log
    intake for relays and connectors; and the admin API. Every request may
    carry a Warren-Protocol header; a version the control plane does not
    speak is refused with reason unsupported_protocol. Errors are RFC 9457
    problem details with a stable reason code and a human-readable detail.
  license:
    name: Apache-2.0
servers:
  - url: https://{organization}
    description: The control plane's HTTPS listener (links D and E).
    variables:
      organization:
        default: warren.example.com
  - url: http://localhost
    description: >-
      The admin API, served on the control plane's local Unix socket
      (default /var/lib/warren/admin.sock, mode 0600). The web console
      offers a few of its changes remotely (docs/console.md).
tags:
  - name: client
    description: Link D, used by the warren app.
  - name: node
    description: Link E, used by relays and connectors with their infrastructure certificates.
  - name: admin
    description: The admin API on the local socket.
paths:
  /.well-known/warren:
    get:
      tags: [client]
      operationId: discovery
      summary: What a client needs to start, given only the organization URL
      responses:
        "200":
          description: Discovery document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discovery" }
  /v1/auth/authorize:
    get:
      tags: [client]
      operationId: authorize
      summary: Start sign-in in the system browser (RFC 8252, RFC 7636)
      parameters:
        - { name: redirect_uri, in: query, required: true, schema: { type: string }, description: "An http loopback URI on 127.0.0.1 or [::1], any port, or a URI the operator configured." }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 512 } }
        - { name: prompt, in: query, required: false, schema: { type: string, enum: [login] }, description: "login when the user asked to sign in again: the identity provider must authenticate them afresh." }
      responses:
        "200":
          description: >-
            The sign-in page, when built-in accounts are on and either no
            identity provider is configured or built-in accounts exist: a
            username and password form, and a button for the identity
            provider when there is one. It sets the __Host-warren-signin
            cookie that binds the sign-in to this browser.
        "302": { description: "Redirect to the identity provider, with max_age set to the shortest auth.maxAge in policy, and prompt=login if the client sent it (Google: prompt=select_account, and no max_age)." }
        "400": { description: An HTML page explaining why sign-in could not start; never a redirect. }
        "502": { description: The identity provider is unreachable. }
  /v1/auth/idp:
    get:
      tags: [client]
      operationId: signInWithIdp
      summary: The sign-in page's identity provider button
      parameters:
        - { name: flow, in: query, required: true, schema: { type: string } }
        - { name: login, in: query, required: false, schema: { type: string, enum: ["0", "1"] } }
      responses:
        "302": { description: Redirect to the identity provider, as from authorize. }
        "400": { description: The sign-in expired, or belongs to another browser. }
  /v1/auth/password:
    post:
      tags: [client]
      operationId: signInPassword
      summary: A built-in account's username and password, the first of two steps
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/PasswordForm" }
      responses:
        "200": { description: The authenticator code page, or the authenticator enrollment page (with its QR code) for an account without one. }
        "400": { description: The sign-in expired or belongs to another browser. }
        "401": { description: "The username or password is incorrect, or the username is locked after failed sign-ins: the same page and status for an unknown username, a locked account and a wrong password." }
        "403": { description: The password is correct but the account is disabled, or the form came from another origin. }
        "429": { description: Too many failed sign-ins from this source. }
  /v1/auth/code:
    post:
      tags: [client]
      operationId: signInCode
      summary: An authenticator code or a recovery code, or the first code of an authenticator being enrolled
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/CodeForm" }
      responses:
        "200": { description: After enrollment, the page showing the new recovery codes once. }
        "303": { description: "Redirect to the client's redirect URI with a one-time code (auth_time now, mfa true) and the client's state." }
        "400": { description: The sign-in expired or belongs to another browser. }
        "401": { description: The code is wrong, too old, or was already used, or the account is locked after failed sign-ins (the same page either way). }
        "403": { description: The form came from another origin. }
        "429": { description: Too many failed sign-ins from this source. }
  /v1/auth/continue:
    post:
      tags: [client]
      operationId: signInContinue
      summary: Finish a sign-in once the new recovery codes were shown
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [flow]
              properties: { flow: { type: string } }
      responses:
        "303": { description: Redirect to the client's redirect URI with a one-time code and the client's state. }
        "400": { description: The sign-in expired or belongs to another browser. }
  /v1/auth/setup:
    get:
      tags: [client]
      operationId: setupForm
      summary: The password form of a one-time setup link
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: The form. }
        "400": { description: The link expired or was already used. }
    post:
      tags: [client]
      operationId: setupPassword
      summary: Set a built-in account's password and spend the setup link
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, password, confirm]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12, maxLength: 256 }
                confirm: { type: string }
      responses:
        "200": { description: The password is set; the user signs in from the app and enrolls an authenticator then. }
        "400": { description: The passwords differ or are not acceptable, or the link expired. }
  /v1/auth/callback:
    get:
      tags: [client]
      operationId: callback
      summary: The identity provider's redirect back to the control plane
      responses:
        "302":
          description: >-
            Redirect to the client's redirect URI with a one-time code and the
            client's state, or with error and error_description.
        "400": { description: The sign-in link expired or was already used. }
  /v1/auth/token:
    post:
      tags: [client]
      operationId: token
      summary: Exchange the one-time code for a session bound to the device key
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              type: string
              description: >-
                A compact JWS, ES256, typ warren-session-request+jws, with the
                device's public key in the jwk header member and a
                SessionRequest as payload.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/devices:
    post:
      tags: [client]
      operationId: enroll
      summary: Enroll the session's device key
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "201":
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "200":
          description: Already enrolled; bound to this user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/devices/current:
    get:
      tags: [client]
      operationId: currentDevice
      summary: The device the session's key belongs to
      security: [{ session: [] }]
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/certificates:
    post:
      tags: [client]
      operationId: clientCertificate
      summary: Issue or renew the user+device certificate
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateRequest" }
      responses:
        "200":
          description: The certificate and its issuing CA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "421": { $ref: "#/components/responses/Problem" }
  /v1/entitlements:
    get:
      tags: [client]
      operationId: entitlements
      summary: The apps the user may reach or request, and the relays
      security: [{ session: [] }]
      responses:
        "200":
          description: Entitlements; never names apps the user may neither reach nor request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlements" }
        "421": { $ref: "#/components/responses/Problem" }
  /v1/join:
    post:
      tags: [node]
      operationId: join
      summary: Exchange a single-use join token for a first infrastructure certificate
      description: >-
        The join exchange of protocol.md section 10.3. The node reaches the
        endpoint the token names and verifies it against the root the token
        pins; the control plane checks the token and the request's
        signature, spends the token, and issues a certificate naming the
        role, group, name and DNS names the token was minted for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRequest" }
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/node/policy-key:
    get:
      tags: [node]
      operationId: nodePolicyKey
      summary: The policy-signing key, for verifying bundles
      description: >-
        Served on link E, where the node has verified the control plane
        against the trust bundle its join pinned; the node keeps the key to
        verify every bundle with.
      security: [{ infrastructure: [] }]
      responses:
        "200":
          description: The policy-signing key as a P-256 JWK.
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/node/bundle:
    get:
      tags: [node]
      operationId: bundle
      summary: The latest signed policy bundle for this node's role
      security: [{ infrastructure: [] }]
      responses:
        "200":
          description: A compact JWS, ES256, typ warren-bundle+jws; the ETag is the version.
          content:
            application/jose:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/node/events:
    get:
      tags: [node]
      operationId: events
      summary: The revocation push channel
      security: [{ infrastructure: [] }]
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Resume after this sequence number; without it the stream starts with a snapshot.
      responses:
        "200":
          description: >-
            A long-lived stream of JSON lines: events, heartbeats at least
            every EVENT_HEARTBEAT_INTERVAL, and snapshots (docs/protocol.md
            section 12).
          content:
            application/x-ndjson:
              schema: { type: string }
  /v1/node/events/ack:
    post:
      tags: [node]
      operationId: ackEvents
      summary: Report when events took effect and what they cut
      security: [{ infrastructure: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AckRequest" }
      responses:
        "200": { description: Recorded. }
  /v1/node/audit:
    post:
      tags: [node]
      operationId: audit
      summary: Send access-decision and flow records
      security: [{ infrastructure: [] }]
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: >-
                One OCSF-shaped JSON object per line, each with integer
                class_uid and time. The control plane stamps
                metadata.log_provider with the reporting node and
                metadata.logged_time; one bad line rejects the request.
      responses:
        "202": { description: Accepted. }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/node/certificate:
    post:
      tags: [node]
      operationId: nodeCertificate
      summary: Renew this node's infrastructure certificate for the same key
      security: [{ infrastructure: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateRequest" }
      responses:
        "200":
          description: The certificate and the infrastructure CA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
  /v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      responses:
        "200": { description: "Every user that is not deleted; built-in accounts carry a local object with their state (password set, authenticator, recovery codes left, lockout, managed_by), never their secrets." }
    post:
      tags: [admin]
      operationId: createUser
      summary: Create a built-in account and get its one-time setup link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created; setup_url is shown once and valid for 72 hours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: object }
                  setup_url: { type: string }
                  setup_expires_at: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/users/{user}:
    delete:
      tags: [admin]
      operationId: deleteUser
      summary: Delete a built-in account; its connections are cut through the push channel
      description: >-
        The account stays as a disabled row so its revocation stays in every
        bundle; its username is freed. Accounts declared in the policy
        directory are refused with reason managed_in_config.
      parameters: [{ $ref: "#/components/parameters/user" }]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/users/{user}/reset:
    post:
      tags: [admin]
      operationId: resetUser
      summary: Reset a built-in account's credentials and get a new setup link
      description: >-
        Clears the password, the authenticator, recovery codes and the
        lockout, and revokes every live session through the push channel.
        Also how an account declared in the policy directory gets its first
        setup link.
      parameters: [{ $ref: "#/components/parameters/user" }]
      responses:
        "200":
          description: The new setup link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  setup_url: { type: string }
                  setup_expires_at: { type: integer }
                  sessions_revoked: { type: integer }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/users/{user}/unlock:
    post:
      tags: [admin]
      operationId: unlockUser
      summary: Lift a built-in account's lockout after failed sign-ins
      parameters: [{ $ref: "#/components/parameters/user" }]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
  /v1/admin/users/{user}/groups:
    put:
      tags: [admin]
      operationId: setUserGroups
      summary: Set the local groups a user (built-in or of the IdP) is in through the API
      description: >-
        Groups declared as LocalGroup objects in the policy directory are
        refused with reason managed_in_config. Removing a group ships a new
        bundle through the push channel.
      parameters: [{ $ref: "#/components/parameters/user" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupsRequest" }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/users/{user}/disable:
    post:
      tags: [admin]
      operationId: disableUser
      summary: Disable a user; their connections are cut through the push channel
      parameters: [{ $ref: "#/components/parameters/user" }]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
  /v1/admin/users/{user}/enable:
    post:
      tags: [admin]
      operationId: enableUser
      parameters: [{ $ref: "#/components/parameters/user" }]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
  /v1/admin/users/{user}/sessions:
    get:
      tags: [admin]
      operationId: userSessions
      parameters: [{ $ref: "#/components/parameters/user" }]
      responses:
        "200": { description: The user's sessions, newest first. }
  /v1/admin/groups:
    get:
      tags: [admin]
      operationId: listGroups
      summary: warren's own groups, with members, the emails of policy-declared members waiting for their first sign-in, and whether the policy directory or the API manages each
      responses:
        "200": { description: The groups. }
  /v1/admin/sessions/{session}/revoke:
    post:
      tags: [admin]
      operationId: revokeSession
      parameters:
        - { name: session, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
  /v1/admin/devices:
    get:
      tags: [admin]
      operationId: listDevices
      responses:
        "200": { description: Every device. }
  /v1/admin/devices/{device}/approve:
    post:
      tags: [admin]
      operationId: approveDevice
      parameters: [{ $ref: "#/components/parameters/device" }]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/devices/{device}/enable:
    post:
      tags: [admin]
      operationId: enableDevice
      parameters: [{ $ref: "#/components/parameters/device" }]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/devices/{device}/disable:
    post:
      tags: [admin]
      operationId: disableDevice
      parameters: [{ $ref: "#/components/parameters/device" }]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
  /v1/admin/devices/{device}/revoke:
    post:
      tags: [admin]
      operationId: revokeDevice
      parameters: [{ $ref: "#/components/parameters/device" }]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
  /v1/admin/certificates/{serial}/revoke:
    post:
      tags: [admin]
      operationId: revokeCertificate
      parameters:
        - { name: serial, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]+$" } }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
  /v1/admin/policy:
    get:
      tags: [admin]
      operationId: policyStatus
      summary: The policy in force and the outcome of the last load
      responses:
        "200": { description: Policy status. }
  /v1/admin/policy/reload:
    post:
      tags: [admin]
      operationId: reloadPolicy
      summary: Reload the policy directory; a policy that does not compile changes nothing
      responses:
        "200": { description: Loaded and published. }
        "422": { description: Rejected, with every error by file and line. }
  /v1/admin/join-tokens:
    post:
      tags: [admin]
      operationId: createJoinToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, name]
              additionalProperties: false
              properties:
                role: { type: string, enum: [relay, connector] }
                group: { type: string, description: The connector group, for connectors. }
                name: { type: string, description: "The node's name, unique within its role: 1 to 63 lowercase letters, digits and '-'." }
                dns_names:
                  type: array
                  maxItems: 16
                  items: { type: string }
                  description: Host names the relay listens on (relays only); none may be warren's own or claimed by an app.
      responses:
        "201":
          description: >-
            The token (warren-join-v1., protocol.md section 10.3), valid once
            for JOIN_TOKEN_LIFETIME, with the role, group, name, DNS names
            and expiry it was minted for, and control_plane, the URL the node
            joins at: publicUrl, or with an operator certificate on its host,
            the same URL under an internal name from dnsNames.
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/nodes:
    get:
      tags: [admin]
      operationId: listNodes
      responses:
        "200": { description: Every relay and connector. }
  /v1/admin/nodes/{node}/revoke:
    post:
      tags: [admin]
      operationId: revokeNode
      parameters:
        - { name: node, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
  /v1/admin/revocation-latency:
    get:
      tags: [admin]
      operationId: revocationLatency
      summary: Commit-to-cut latency measured from node acknowledgements
      responses:
        "200": { description: Count, median, 99th percentile, maximum and how many exceeded the deadline. }
  /v1/admin/deployment:
    get:
      tags: [admin]
      operationId: deployment
      summary: The deployment's trust domain, organization URL and root fingerprint
      description: >-
        The root fingerprint is what a client pins to sign in when the
        organization URL has no certificate its system trusts
        (`warren login --fingerprint`), and what an MDM profile presets.
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema:
                type: object
                required: [trust_domain, public_url, root_fingerprint]
                properties:
                  trust_domain: { type: string }
                  public_url: { type: string }
                  root_fingerprint: { type: string, description: "`sha256:` and the lowercase hex SHA-256 of the root CA certificate, DER." }
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The session token from /v1/auth/token. Every call that yields a credential also needs a CSR signed by the session's device key.
    infrastructure:
      type: mutualTLS
      description: An infrastructure certificate from the deployment's infrastructure CA, naming an enabled relay or connector.
  parameters:
    user:
      { name: user, in: path, required: true, schema: { type: string }, description: "User ID, email, IdP subject, or a built-in account's username (local:<username> when it could be ambiguous)." }
    device:
      { name: device, in: path, required: true, schema: { type: string } }
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Changed:
      description: Whether the request changed anything.
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string }
              changed: { type: boolean }
              what: { type: string }
  schemas:
    Problem:
      type: object
      required: [status, reason, title, detail]
      properties:
        status: { type: integer }
        reason: { type: string, description: "A stable code, such as device_not_approved, user_disabled, reauth_required, key_mismatch, invalid_grant." }
        title: { type: string }
        detail: { type: string, description: What happened and what to do, for people. }
    Discovery:
      type: object
      properties:
        trust_domain: { type: string }
        api_base: { type: string, description: "For sign-in and enrollment only; an enrolled client makes later calls at the api_base its enrollment answer gives." }
        authorize_endpoint: { type: string }
        token_endpoint: { type: string }
        trust_bundle: { type: string, description: "PEM: root CA, client CA, infrastructure CA." }
        protocol_versions: { type: array, items: { type: integer } }
    SessionRequest:
      type: object
      required: [code, code_verifier, redirect_uri, iat]
      properties:
        code: { type: string }
        code_verifier: { type: string }
        redirect_uri: { type: string }
        iat: { type: integer, description: Unix seconds; must be within the clock-skew allowance. }
    Session:
      type: object
      properties:
        session_id: { type: string }
        token: { type: string }
        expires_at: { type: integer }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            groups: { type: array, items: { type: string } }
        auth_time: { type: integer, description: "When the user authenticated at the identity provider, Unix seconds; 0 when it did not say." }
        mfa: { type: boolean }
    EnrollRequest:
      type: object
      required: [csr, platform, key_storage]
      properties:
        csr: { type: string, description: A PKCS#10 request signed by the device key, DER, base64. }
        platform:
          type: object
          properties:
            os: { type: string }
            os_version: { type: string }
            model: { type: string }
            hostname: { type: string }
        key_storage: { type: string, enum: [secure-enclave, software] }
    Device:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, approved, disabled, revoked] }
        tunnel_v4: { type: string }
        tunnel_v6: { type: string }
        trust_class: { type: integer, minimum: 1, maximum: 3 }
        api_base:
          type: string
          description: >-
            Where the enrolled client makes every later call, verified against
            the trust bundle with the control-plane URI SAN. With an operator
            certificate on the organization URL's host, this is under an
            internal name, and those calls are refused at the organization
            URL's host with 421.
    CertificateRequest:
      type: object
      required: [csr]
      properties:
        csr: { type: string, description: A PKCS#10 request, DER, base64. }
    Certificate:
      type: object
      properties:
        certificate_chain: { type: string, description: The certificate and its issuing CA, PEM. }
        serial: { type: string }
        not_before: { type: integer }
        not_after: { type: integer }
        renew_at: { type: integer }
    Entitlements:
      type: object
      properties:
        version: { type: integer, description: The bundle version the entitlements come from. }
        apps:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              access: { type: string, enum: [allowed, requestable] }
              connector_group: { type: string }
              destinations:
                type: array
                items:
                  type: object
                  properties:
                    host: { type: string }
                    cidr: { type: string }
                    protocol: { type: string, enum: [tcp, udp, icmp, any] }
                    ports:
                      type: array
                      items:
                        type: object
                        properties:
                          from: { type: integer }
                          to: { type: integer }
        dns_suffixes: { type: array, items: { type: string } }
        relays:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              dns_names: { type: array, items: { type: string } }
    JoinRequest:
      type: object
      required: [token, csr]
      additionalProperties: false
      properties:
        token: { type: string, description: "The join token, warren-join-v1. followed by base64url JSON." }
        csr: { type: string, description: A PKCS#10 request with an empty subject, signed by the node's P-256 key, DER, base64. }
    JoinResponse:
      type: object
      required: [chain, trustBundle]
      additionalProperties: false
      properties:
        chain:
          type: array
          items: { type: string }
          description: The node's certificate, then the infrastructure CA, DER, base64.
        trustBundle:
          type: object
          required: [root, clientCas, infraCas]
          additionalProperties: false
          properties:
            root: { type: string, description: The root CA certificate, DER, base64. }
            clientCas: { type: array, items: { type: string } }
            infraCas: { type: array, items: { type: string } }
    PasswordForm:
      type: object
      required: [flow, username, password]
      properties:
        flow: { type: string, description: The sign-in's flow token from the page. }
        username: { type: string }
        password: { type: string }
        login: { type: string, enum: ["0", "1"], description: "1 when the client asked for a fresh sign-in (prompt=login), kept for the identity provider button if the password fails." }
    CodeForm:
      type: object
      required: [flow, code]
      properties:
        flow: { type: string }
        code: { type: string, description: "Six digits from the authenticator app, or a recovery code (xxxxx-xxxxx)." }
    CreateUserRequest:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        username: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        email: { type: string }
        display_name: { type: string }
        groups: { type: array, items: { type: string }, description: "Local groups, with or without the local: prefix." }
    GroupsRequest:
      type: object
      required: [groups]
      additionalProperties: false
      properties:
        groups: { type: array, items: { type: string } }
    AckRequest:
      type: object
      required: [acks]
      properties:
        acks:
          type: array
          items:
            type: object
            required: [seq, applied_at_ms, connections_cut]
            properties:
              seq: { type: integer }
              applied_at_ms: { type: integer }
              connections_cut: { type: integer }
