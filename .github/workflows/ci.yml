name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Builds never touch the network: .cargo/config.toml points cargo at vendor/,
# and every cargo invocation passes --locked --offline. The toolchain comes from
# rust-toolchain.toml. Third-party actions are pinned by commit.
jobs:
  lint:
    name: rustfmt, shellcheck and script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: shellcheck scripts/*.sh macos/*.sh
      - name: DCO gate tests
        run: scripts/test-check-dco.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: clippy, all roles
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: clippy, data-path build
        run: cargo clippy -p warren --no-default-features --features relay,connector --all-targets --locked --offline -- -D warnings
      - name: clippy, client build
        run: cargo clippy -p warren --no-default-features --features client --all-targets --locked --offline -- -D warnings

  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --workspace --all-targets --locked --offline
      - run: cargo test --workspace --locked --offline
      - name: test the data-path build
        run: cargo test -p warren --no-default-features --features relay,connector --locked --offline

  e2e-kernel:
    name: kernel-mode end-to-end (network namespaces)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: nftables for the connector's NAT and the UDP-blocking test
        run: sudo apt-get install -y --no-install-recommends nftables
      - run: cargo build -p warren -p warren-harness --locked --offline
      - name: relay, connector (TUN and NAT) and test client in namespaces
        run: sudo scripts/e2e-kernel.sh target/debug

  macos-client:
    name: macOS client (clippy, end-to-end with sudo, Swift app build)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: clippy on macOS (utun, Secure Enclave, privilege separation)
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: clippy, client build
        run: cargo clippy -p warren --no-default-features --features client --all-targets --locked --offline -- -D warnings
      - run: cargo build -p warren -p warren-harness --locked --offline
      - name: control plane, relay, connector stand-in and warren up on this Mac
        run: scripts/e2e-macos.sh target/debug
      - name: menu-bar app and packet tunnel extension (unsigned)
        run: macos/build.sh

  macos-release:
    name: macOS client release build (universal, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: build the client for both architectures
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p warren --no-default-features --features client --target "$target" --locked --offline
          done
      - name: universal binary and tarball
        run: scripts/package-macos.sh "ci-${GITHUB_SHA::12}" dist

  bench:
    name: benchmarks (informative, never gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: nftables and WireGuard tools
        run: sudo apt-get install -y --no-install-recommends nftables wireguard-tools
      - run: cargo build --release -p warren -p warren-harness --locked --offline
      - name: in-process benchmarks
        run: scripts/bench-inprocess.sh target/release 5 --summary "$GITHUB_STEP_SUMMARY"
      - name: kernel-mode benchmarks
        run: sudo scripts/bench-kernel.sh target/release 10 --summary "$GITHUB_STEP_SUMMARY"

  chart:
    name: Helm chart (lint and template tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned Helm and kind (CI-only tools, digest-verified)
        run: |
          scripts/install-kube-tools.sh "$RUNNER_TEMP/kube-tools"
          echo "$RUNNER_TEMP/kube-tools" >> "$GITHUB_PATH"
      - run: scripts/test-chart.sh

  images:
    name: container images (dry run) and the chart on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The arm64 connector image installs its packages under emulation; the
      # binary itself is cross-compiled.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: every image for linux/amd64 and linux/arm64, not pushed
        run: |
          for target in warren warren-relay warren-connector; do
            docker buildx build --platform linux/amd64,linux/arm64 --target "$target" .
          done
      - name: load the linux/amd64 images for kind
        run: |
          for target in warren warren-relay warren-connector; do
            docker buildx build --load --target "$target" -t "$target:ci" .
          done
      - name: the relay and connector images run the data-path build
        run: |
          docker run --rm warren:ci control-plane --help >/dev/null
          for image in warren-relay:ci warren-connector:ci; do
            docker run --rm "$image" relay --help >/dev/null
            docker run --rm "$image" connector --help >/dev/null
            if docker run --rm "$image" control-plane --help >/dev/null 2>&1; then
              echo "error: $image offers the control-plane role" >&2
              exit 1
            fi
          done
      - name: install pinned Helm and kind (CI-only tools, digest-verified)
        run: |
          scripts/install-kube-tools.sh "$RUNNER_TEMP/kube-tools"
          echo "$RUNNER_TEMP/kube-tools" >> "$GITHUB_PATH"
      - name: control plane, relay and kernel-mode connector from the chart on kind
        run: scripts/e2e-kind.sh warren:ci warren-relay:ci warren-connector:ci

  deps:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: install pinned cargo-deny and cargo-vet (CI-only tools, digest-verified)
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
      - name: direct dependencies are allowlisted and pinned
        run: scripts/check-deps.sh
      - name: per-binary closure report and growth gate
        run: scripts/check-closure.sh
      - name: vendor/ matches Cargo.lock
        run: scripts/check-vendor.sh
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny --locked check
      - name: cargo vet
        run: cargo vet --locked

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: every outside commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
