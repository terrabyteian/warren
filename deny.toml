# cargo-deny configuration: advisories, licenses, bans and sources for the
# whole workspace. CI runs `cargo deny --locked check`. See
# docs/dependencies.md for the policy this file encodes.

[graph]
# The release targets. Keep in sync with TARGETS in scripts/check-closure.sh.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[output]
feature-depth = 1

[advisories]
# Vulnerabilities always fail. Unmaintained, unsound and yanked crates fail
# too; an exception needs an entry here with a reason and a tracking issue.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with Apache-2.0 distribution. Adding one is a
# reviewed change.
allow = [
    "Apache-2.0",
    "MIT",
    # aws-lc (aws-lc-rs, aws-lc-sys), rustls-webpki and untrusted.
    "ISC",
    # subtle (constant-time primitives under rustls) and parts of aws-lc.
    "BSD-3-Clause",
    # aws-lc-sys (code inherited from upstream projects).
    "MIT-0",
    # unicode-ident's Unicode data tables (proc-macro build dependency) and
    # the icu_* crates under url (sqlx's connection strings).
    "Unicode-3.0",
    # foldhash, the default hasher of hashbrown.
    "Zlib",
    # ar_archive_writer, a build dependency of stacker under Cedar's parser.
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
# Workspace crates are unpublished and licensed by the repository LICENSE.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # Crypto comes from rustls on aws-lc-rs and nothing else.
    { crate = "ring", reason = "aws-lc-rs is warren's only crypto provider" },
    { crate = "openssl", reason = "aws-lc-rs is warren's only crypto provider" },
    { crate = "openssl-sys", reason = "aws-lc-rs is warren's only crypto provider" },
    { crate = "native-tls", reason = "TLS is rustls only" },
]
# Kubernetes, operator and console crates are kept out of the data-path builds
# by scripts/check-closure.sh, which checks each binary's closure separately.
skip = [
    { crate = "cpufeatures@0.2.17", reason = "sha2 0.10 (sqlx-core) and keccak (lalrpop's sha3) pin it; chacha20 under quinn uses 0.3" },
    { crate = "hashbrown@0.16.1", reason = "hashlink 0.11 (sqlx-core) pins it; everything else uses 0.17" },
    { crate = "itertools@0.14.0", reason = "lalrpop, Cedar's build-time parser generator, pins it; Cedar itself uses 0.15" },
    { crate = "syn@2.0.119", reason = "logos-codegen, miette-derive and tracing-attributes still use syn 2; the rest use syn 3" },
    { crate = "unicode-width@0.1.14", reason = "miette (Cedar's diagnostics) pins it; pretty uses 0.2" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
